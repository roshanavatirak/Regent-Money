name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Create .env for APK Bundling
        run: |
          cat << 'EOF' > .env
          EXPO_PUBLIC_BACKEND_URL=${{ secrets.EXPO_PUBLIC_BACKEND_URL || 'https://regent-money.onrender.com' }}
          EOF

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Read App Version from app.json
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          VERSION_CODE=$(node -e "
            const j = require('./app.json');
            const manualCode = j.expo.android?.versionCode;
            const parts = (j.expo.version || '1.0.0').replace(/^v/, '').split('.').map(p => parseInt(p, 10) || 0);
            const autoCode = (parts[0] || 1) * 10000 + (parts[1] || 0) * 100 + (parts[2] || 0);
            console.log(manualCode && manualCode > autoCode ? manualCode : autoCode);
          ")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Building Regent Money Version: $VERSION (Auto VersionCode: $VERSION_CODE)"

      - name: Build Android Release APK
        env:
          EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_URL || 'https://regent-money.onrender.com' }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          cd android
          echo "Building Regent Money with versionCode: $APP_VERSION_CODE, versionName: $APP_VERSION"
          ./gradlew assembleRelease -PversionCode=$APP_VERSION_CODE -PversionName=$APP_VERSION --no-daemon -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease

      - name: Prepare Direct APK for Release
        run: |
          mkdir -p release-dist
          # Find generated release APK and copy with standard name
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" release-dist/regent-money.apk
          cp "$APK_PATH" "release-dist/regent-money-v${APP_VERSION}.apk"
          ls -la release-dist/

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: regent-money-apk
          path: release-dist/*.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          name: "Regent Money v${{ env.APP_VERSION }}"
          body: |
            ### Regent Money Android Release v${{ env.APP_VERSION }}
            - Direct APK Download: [regent-money.apk](https://github.com/roshanavatirak/Regent-Money/releases/download/v${{ env.APP_VERSION }}/regent-money.apk)
            - Automated build from commit `${{ github.sha }}`
          files: release-dist/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
