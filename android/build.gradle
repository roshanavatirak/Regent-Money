// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }

  // Disable lintVital tasks across all subprojects (cuts build time from 30+ mins to ~3-5 mins and prevents 3rd-party library lint failures)
  tasks.whenTaskAdded { task ->
    if (task.name.startsWith("lintVital")) {
      task.enabled = false
    }
  }
}

subprojects {
  afterEvaluate { project ->
    if (project.hasProperty("android")) {
      try {
        project.android {
          defaultConfig {
            externalNativeBuild {
              cmake {
                arguments "-DCMAKE_POLICY_DEFAULT_CMP0057=NEW"
              }
            }
          }
        }
      } catch (Exception ignored) {
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
