// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext {
    buildToolsVersion = findProperty('android.buildToolsVersion') ?: '36.0.0'
    minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
    compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '36')
    targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '35')
    ndkVersion = "27.1.12297006"
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }

  // Disable lintVital tasks across all subprojects (cuts build time from 30+ mins to ~3-5 mins and prevents 3rd-party library lint failures)
  tasks.whenTaskAdded { task ->
    if (task.name.startsWith("lintVital")) {
      task.enabled = false
    }
  }
}

subprojects {
  afterEvaluate { project ->
    if (project.hasProperty("android")) {
      try {
        project.android {
          ndkVersion = rootProject.ext.ndkVersion
          defaultConfig {
            externalNativeBuild {
              cmake {
                arguments "-DCMAKE_POLICY_DEFAULT_CMP0057=NEW"
              }
            }
          }
        }
      } catch (Exception e) {
        logger.warn("[build.gradle] Could not configure ndkVersion/cmake on ${project.name}: ${e.message}")
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
